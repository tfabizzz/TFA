<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Success | TFA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(#f4f7f9, #e6ebf0);
      font-family: 'Segoe UI', sans-serif;
      color: #2c3e50;
      overflow: hidden;
    }

    .snowflake {
      position: fixed;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      color: #27ae60;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .tagline {
      font-size: 1.4rem;
      font-weight: 500;
      color: #34495e;
      margin-bottom: 30px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 1rem;
      background-color: #1e3d59;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #162d42;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="snowCanvas" class="snowflake"></canvas>

  <div class="container">
    <h1>Payment Successful</h1>
    <div class="tagline">You're officially part of something impactful ✨</div>
    <p>Thank you for placing your trust in <strong>TFA</strong>. Your payment was successful, and we’re excited to begin this journey with you.</p>
    <a class="btn" href="https://thefineace.com">Go Back to Home</a>
  </div>

  <script>
    const canvas = document.getElementById("snowCanvas");
    const ctx = canvas.getContext("2d");
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const snowflakes = [];

    for (let i = 0; i < 100; i++) {
      snowflakes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 3 + 1,
        speed: Math.random() * 1 + 0.5,
      });
    }

    function drawSnowflakes() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.beginPath();
      for (const flake of snowflakes) {
        ctx.moveTo(flake.x, flake.y);
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
      }
      ctx.fill();
      moveSnowflakes();
    }

    function moveSnowflakes() {
      for (const flake of snowflakes) {
        flake.y += flake.speed;
        if (flake.y > height) {
          flake.y = 0;
          flake.x = Math.random() * width;
        }
      }
    }

    function animateSnow() {
      drawSnowflakes();
      requestAnimationFrame(animateSnow);
    }

    animateSnow();

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
